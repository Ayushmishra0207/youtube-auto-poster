# Checks on every push / PR: Python tests (incl. the Postgres code path against a
# real Postgres) and the dashboard's type-check + production build.
# (Replaces the old conda template workflow, which failed on every push because
# the repo has no environment.yml.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r api/requirements.txt "psycopg[binary]>=3.2" pytest pyflakes
      - name: Lint (fail only on undefined names / syntax errors)
        run: |
          python -m pyflakes api pipeline clipper *.py > pyflakes.txt || true
          if grep -E "undefined name|syntax error|invalid syntax" pyflakes.txt; then exit 1; fi
      - name: Tests (SQLite)
        run: python -m pytest -q tests
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_cloud_store.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
