services:
  - type: web
    name: yt-autoposter-api
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -r api/requirements.txt && python setup_fonts.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    plan: free
    envVars:
      # ── Cloud mode: Supabase (state + media) and GitHub Actions (heavy work) ──
      # DATABASE_URL: Supabase → Project Settings → Database → "Session pooler" URI
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Supabase → Project Settings → API Keys → secret key (sb_secret_…) or legacy service_role
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GITHUB_REPO
        value: Ayushmishra0207/youtube-auto-poster
      # Fine-grained token for this repo with "Actions: Read and write"
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      # Your Vercel URL, e.g. https://youtube-auto-poster.vercel.app (CORS)
      - key: FRONTEND_URL
        sync: false
      - key: YOUTUBE_TOKEN_B64
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TOPIC_CONFIG_JSON
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: KEEP_OUTPUT_DAYS
        value: "3"
      - key: TTS_VOICE
        value: "hi-IN-MadhurNeural"
      - key: TTS_RATE
        value: "-12%"
      - key: TTS_PITCH
        value: "-4Hz"
      - key: PYTHON_VERSION
        value: "3.11.0"
